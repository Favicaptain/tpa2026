<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What exactly are you looking for?</title>
<style>
  :root{
    --ink:#e9edff;
    --accent:#ffd166;
    --shoe:#141a2c;
  }

  *{box-sizing:border-box}
  html,body{height:100%}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(4px, 2vh, 20px);
    padding:24px 16px;
    overflow:hidden;
    background:radial-gradient(120% 85% at 50% 0%, #1e2750 0%, #10152e 48%, #070a16 100%);
    color:var(--ink);
    font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------------- title ---------------- */
  .title{
    margin:0;
    text-align:center;
    font-weight:800;
    font-size:clamp(20px, 5.2vw, 42px);
    line-height:1.15;
    letter-spacing:-.02em;
    animation:rise .85s cubic-bezier(.2,.8,.25,1) both;
  }

  .title .line2{
    display:block;
    background:linear-gradient(90deg,#ffd166,#ff9f6e,#ffd166);
    background-size:200% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    animation:rise .85s .1s cubic-bezier(.2,.8,.25,1) both,
              shimmer 5s linear infinite;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(16px)}
    to  {opacity:1; transform:translateY(0)}
  }

  @keyframes shimmer{
    to{background-position:200% 0}
  }

  /* ---------------- stage ---------------- */
  .stage{
    display:block;
    height:min(56vh, 380px);
    width:auto;
    filter:drop-shadow(0 18px 26px rgba(0,0,0,.45));
  }

  .anchor{fill:none}

  /* ---------------- walk cycle ---------------- */
  .walker{
    animation:bodyBob .9s ease-in-out infinite;
  }

  @keyframes bodyBob{
    0%   {transform:translate(0, 7px)}
    25%  {transform:translate(1.5px, 0)}
    50%  {transform:translate(0, 7px)}
    75%  {transform:translate(-1.5px, 0)}
    100% {transform:translate(0, 7px)}
  }

  /* every rotating part carries an invisible "anchor" rect centred on its
     joint, so 50%/50% of its bounding box is always exactly the pivot. */
  .leg, .shin, .arm, .head{
    transform-box:fill-box;
    transform-origin:50% 50%;
  }

  .leg {animation:thighSwing .9s ease-in-out infinite}
  .shin{animation:shinSwing  .9s ease-in-out infinite}
  .arm {animation:armSwing   .9s ease-in-out infinite}
  .head{animation:headTilt   4s  ease-in-out infinite}

  .leg.phase2, .shin.phase2, .arm.phase2{animation-delay:-.45s}

  @keyframes thighSwing{
    0%,100%{transform:rotate(-24deg)}
    50%    {transform:rotate(24deg)}
  }

  @keyframes shinSwing{
    0%  {transform:rotate(5deg)}
    35% {transform:rotate(7deg)}
    52% {transform:rotate(22deg)}
    70% {transform:rotate(58deg)}
    90% {transform:rotate(12deg)}
    100%{transform:rotate(5deg)}
  }

  @keyframes armSwing{
    0%,100%{transform:rotate(28deg)}
    50%    {transform:rotate(-28deg)}
  }

  @keyframes headTilt{
    0%  {transform:rotate(-7deg)}
    28% {transform:rotate(6deg)}
    55% {transform:rotate(-3deg)}
    78% {transform:rotate(9deg)}
    100%{transform:rotate(-7deg)}
  }

  /* ---------------- ground & shadow ---------------- */
  .ground{animation:scrollGround .9s linear infinite}
  @keyframes scrollGround{
    to{stroke-dashoffset:-36}
  }

  .shadow{
    transform-box:fill-box;
    transform-origin:50% 50%;
    animation:shadowPulse .9s ease-in-out infinite;
  }
  @keyframes shadowPulse{
    0%,50%,100%{transform:scaleX(1);    opacity:.6}
    25%,75%    {transform:scaleX(.86);  opacity:.42}
  }

  /* ---------------- question marks ---------------- */
  .q{
    transform-box:fill-box;
    transform-origin:50% 50%;
    opacity:0;
    animation:floatQ 3.6s ease-in-out infinite;
  }
  .q:nth-child(1){animation-delay:.2s}
  .q:nth-child(2){animation-delay:1.4s}
  .q:nth-child(3){animation-delay:2.6s}

  @keyframes floatQ{
    0%  {opacity:0; transform:translate(0, 8px)  scale(.5)  rotate(-12deg)}
    20% {opacity:1; transform:translate(0,-2px)  scale(1)   rotate(0deg)}
    70% {opacity:1; transform:translate(2px,-16px) scale(1) rotate(8deg)}
    100%{opacity:0; transform:translate(4px,-26px) scale(.85) rotate(14deg)}
  }

  @media (prefers-reduced-motion: reduce){
    .walker, .leg, .shin, .arm, .head, .ground, .shadow, .q, .title, .title .line2{
      animation-duration:6s;
    }
  }
</style>
</head>
